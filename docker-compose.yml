version: '3.8'

services:
  postgres-dev:
    image: postgres:17-alpine
    container_name: odontosys-postgres-dev
    environment:
      POSTGRES_USER: odontosys
      POSTGRES_PASSWORD: odontosys_dev
      POSTGRES_DB: odontosys_dev
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odontosys -d odontosys_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:17-alpine
    container_name: odontosys-postgres-test
    environment:
      POSTGRES_USER: odontosys
      POSTGRES_PASSWORD: odontosys_test
      POSTGRES_DB: odontosys_test
      PGTZ: UTC
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odontosys -d odontosys_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
  postgres-test-data:
